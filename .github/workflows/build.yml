name: Build RefreshBrowser.exe

on:
  push:
    branches: [main]
  workflow_dispatch:          # permite lanzarlo manualmente desde GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # versión estable con PyInstaller 6.3.0

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install chardet==3.0.4          # evitar versión mypyc (crash en 2da PC)
          pip install pywin32==306
          pip install psutil==5.9.8
          pip install pyinstaller==6.3.0

      - name: Compilar .exe
        run: pyinstaller RefreshBrowser.spec

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RefreshBrowser-Windows
          path: dist/RefreshBrowser.exe
          retention-days: 30
